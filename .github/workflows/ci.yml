name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Cache Next build
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-

      - name: Spelling (gate S17)
        run: npm run lint:spelling

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck the legacy tree
        run: npx tsc -p tsconfig.json --noEmit

      - name: Test with coverage (gate S14)
        run: npm run test:coverage

      - name: CSS syntax
        run: node tools/check-css.mjs

      - name: Directives are the first statement
        run: npm run lint:directives

      - name: SVG ids are scoped to their file
        run: npm run assets:ids:check

      - name: No @apply (gate S6)
        run: |
          count=$(grep -rho "@apply" src components lib 2>/dev/null | wc -l | tr -d ' ')
          echo "@apply occurrences: $count"
          test "$count" -eq 0

      - name: No ambient global types (gate S7)
        run: |
          if [ -d interfaces ]; then
            echo "interfaces/ still exists"
            exit 1
          fi

      - name: No comments in code
        run: |
          found=$(grep -rn --include='*.ts' --include='*.tsx' -E '(^|[^:"'"'"'\\])// |/\*[ *]' \
            src/features src/lib src/server tools \
            | grep -v 'https\?://' | grep -v 'Generated by tools/' || true)
          if [ -n "$found" ]; then
            echo "$found"
            exit 1
          fi

      - name: Every z-index comes from layers.css (P2 C13)
        run: |
          found=$(grep -rn -E 'z-\[|z-index: *[0-9]|zIndex: *[0-9]' \
            src/features src/lib src/server src/styles --include='*.ts' \
            --include='*.tsx' --include='*.css' | grep -v 'layers.css' || true)
          if [ -n "$found" ]; then
            echo "$found"
            exit 1
          fi

      - name: No polling timers in the data layers (P4 C3, D3 C9)
        run: |
          found=$(grep -rn 'setInterval' src/features/comments src/features/entries \
            src/features/notifications src/server || true)
          if [ -n "$found" ]; then
            echo "$found"
            exit 1
          fi

      - name: Theme CSS is regenerated and within budget (T4 C6, gate S5)
        run: npm run themes:check

      - name: Build
        run: npm run build
        env:
          ZIMO_WEB_AWS_KEY_ID: ${{ secrets.ZIMO_WEB_AWS_KEY_ID }}
          ZIMO_WEB_AWS_SECRET_KEY: ${{ secrets.ZIMO_WEB_AWS_SECRET_KEY }}

      - name: Regenerated artifacts are committed
        run: git diff --exit-code
