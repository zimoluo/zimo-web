<!DOCTYPE html>
<html>
<head>
<style>
  html {
    /* Declared on <html>, exactly as themes.generated.css would.
       The inner var() is in the alpha slot of oklch(), per T4 §1.1's "BROKEN" example. */
    --zw-surface-widget-image:
      linear-gradient(0deg,
        oklch(0.5 0.2 316 / calc(1 * var(--zw-surface-widget-alpha, 1))) 0%,
        oklch(0.5 0.2 316 / calc(1 * var(--zw-surface-widget-alpha, 1))) 100%);

    /* The same paint, with no alpha var inside it. Used by the working form. */
    --zw-surface-widget-image-opaque:
      linear-gradient(0deg, oklch(0.5 0.2 316) 0%, oklch(0.5 0.2 316) 100%);
  }
  body { margin: 0; background: #ffffff; }
  .probe { width: 200px; height: 100px; background: #ffffff; }

  /* FORM 1 — alpha as a var() inside the image string declared on <html>. */
  #broken {
    --zw-surface-widget-alpha: 0.25;
    background-image: var(--zw-surface-widget-image);
  }

  /* FORM 2 — opacity on a paint layer, per T4 §1.1's "What works". */
  #works {
    --zw-surface-widget-alpha: 0.25;
    position: relative;
    isolation: isolate;
  }
  #works::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    background-image: var(--zw-surface-widget-image-opaque);
    opacity: var(--zw-surface-widget-alpha, 1);
  }

  /* CONTROL — the same paint at full alpha, for the reference pixel. */
  #full { background-image: var(--zw-surface-widget-image-opaque); }
</style>
</head>
<body>
  <div class="probe" id="broken"></div>
  <div class="probe" id="works"></div>
  <div class="probe" id="full"></div>
</body>
</html>
